name: "CodeQL Analysis"

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  analyze:
    name: CodeQL Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: write
      issues: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: 'results'

      - name: Post Code Quality Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let issuesCount = 0;
            let rulesTriggered = new Set();
            const resultsDir = './results';

            if (fs.existsSync(resultsDir)) {
              const files = fs.readdirSync(resultsDir).filter(f => f.endsWith('.sarif'));
              for (const file of files) {
                try {
                  const content = JSON.parse(fs.readFileSync(path.join(resultsDir, file), 'utf8'));
                  const runs = content.runs || [];
                  for (const run of runs) {
                    const results = run.results || [];
                    issuesCount += results.length;
                    for (const res of results) {
                      if (res.ruleId) rulesTriggered.add(res.ruleId);
                    }
                  }
                } catch (e) {
                  console.log('Error parsing SARIF file:', e);
                }
              }
            }

            const icon = issuesCount === 0 ? '✅' : '⚠️';
            const language = '${{ matrix.language }}';
            let summaryText = `### ${icon} CodeQL Quality Scan Report (${language})\n`;
            summaryText += `**Language:** \`${language}\` | **Issues Found:** \`${issuesCount}\`\n\n`;

            if (issuesCount === 0) {
              summaryText += `✨ **No code quality or security vulnerabilities detected!** Excellent work.`;
            } else {
              summaryText += `⚠️ **Found ${issuesCount} code quality/security alert(s).**\n`;
              if (rulesTriggered.size > 0) {
                summaryText += `**Rules triggered:**\n`;
                Array.from(rulesTriggered).forEach(rule => {
                  summaryText += `- \`${rule}\`\n`;
                });
              }
              summaryText += `\nPlease check the **Security -> Code Scanning** tab for line-by-line recommendations.`;
            }

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summaryText
              });
            } catch (err) {
              console.log('Error posting PR comment:', err);
            }
